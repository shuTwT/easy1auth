services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: easy1auth
      POSTGRES_USER: easy1auth
      POSTGRES_PASSWORD: easy1auth
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easy1auth -d easy1auth"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["easy1auth_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["easy1auth_redis:/data"]
volumes:
  easy1auth_pg:
  easy1auth_redis:
