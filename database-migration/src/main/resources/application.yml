spring:
  config:
    import: optional:file:./.env[.properties]
  application.name: easy1auth-database-migration
  main.web-application-type: none
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/easy1auth}
    username: ${DATABASE_USERNAME:easy1auth}
    password: ${DATABASE_PASSWORD:easy1auth}
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle.timeout-per-shutdown-phase: 20s
