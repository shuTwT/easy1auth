map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream admin_api {
    server admin-api:18848;
    keepalive 32;
}

upstream authorization_server {
    server authorization-server:18850;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    error_page 503 =503 /maintenance.html;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /maintenance.html {
        internal;
    }

    location ^~ /api/ {
        if (-f /var/run/easy1auth/maintenance) { return 503; }
        proxy_pass http://admin_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
    }

    location ^~ /t/ {
        if (-f /var/run/easy1auth/maintenance) { return 503; }
        proxy_pass http://authorization_server;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    location ^~ /oauth-login {
        if (-f /var/run/easy1auth/maintenance) { return 503; }
        proxy_pass http://authorization_server;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    location ^~ /oauth-consent {
        if (-f /var/run/easy1auth/maintenance) { return 503; }
        proxy_pass http://authorization_server;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
