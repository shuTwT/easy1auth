server.port: ${PORT:18848}
server.forward-headers-strategy: framework
spring:
  config:
    import: optional:file:./.env[.properties]
  application.name: easy1auth-admin-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/easy1auth}
    username: ${DATABASE_USERNAME:easy1auth}
    password: ${DATABASE_PASSWORD:easy1auth}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway.enabled: false
  lifecycle.timeout-per-shutdown-phase: 20s
jimmer:
  dialect: org.babyfish.jimmer.sql.dialect.PostgresDialect
management.endpoints.web.exposure.include: health,info
management.endpoint.health:
  probes.enabled: true
  group:
    liveness:
      include: livenessState
      additional-path: server:/livez
    readiness:
      include: readinessState,phase7Readiness
      additional-path: server:/readyz
easy1auth.admin-jwt:
  issuer: ${ADMIN_JWT_ISSUER:https://admin.easy1auth.local}
  audience: ${ADMIN_JWT_AUDIENCE:easy1auth-admin-api}
  secret: ${ADMIN_JWT_SECRET:}
  access-ttl: ${ADMIN_ACCESS_TTL:15m}
  refresh-ttl: ${ADMIN_REFRESH_TTL:30d}
easy1auth.registration:
  expose-code: ${REGISTRATION_EXPOSE_CODE:false}
  from-address: ${REGISTRATION_FROM_ADDRESS:no-reply@easy1auth.local}
easy1auth.security:
  data-encryption-secret: ${SECURITY_DATA_ENCRYPTION_SECRET:}
easy1auth.enterprise-identity:
  public-base-url: ${ENTERPRISE_IDENTITY_PUBLIC_BASE_URL:}
easy1auth.messaging:
  stream-prefix: ${MESSAGING_STREAM_PREFIX:easy1auth:mq}
  consumer-name: ${MESSAGING_CONSUMER_NAME:${HOSTNAME:admin-api}}
  batch-size: ${MESSAGING_BATCH_SIZE:20}
spring.mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:465}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  protocol: smtp
  properties:
    mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
    mail.smtp.ssl.enable: ${MAIL_SMTP_SSL_ENABLE:true}
    mail.smtp.ssl.checkserveridentity: ${MAIL_SMTP_SSL_CHECK_SERVER_IDENTITY:true}
    mail.smtp.starttls.enable: false
    mail.smtp.starttls.required: false
    mail.smtp.connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
    mail.smtp.timeout: ${MAIL_SMTP_READ_TIMEOUT:10000}
    mail.smtp.writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:10000}
