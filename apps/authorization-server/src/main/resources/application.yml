server.port: ${PORT:18850}
server.forward-headers-strategy: framework
spring:
  config:
    import: optional:file:./.env[.properties]
  application.name: easy1auth-authorization-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/easy1auth}
    username: ${DATABASE_USERNAME:easy1auth}
    password: ${DATABASE_PASSWORD:easy1auth}
  flyway.enabled: false
  lifecycle.timeout-per-shutdown-phase: 20s
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.ssl.enable: ${MAIL_SMTP_SSL_ENABLE:true}
      mail.smtp.ssl.checkserveridentity: ${MAIL_SMTP_SSL_CHECK_SERVER_IDENTITY:true}
      mail.smtp.starttls.enable: false
      mail.smtp.starttls.required: false
      mail.smtp.connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${MAIL_SMTP_READ_TIMEOUT:10000}
      mail.smtp.writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:10000}
jimmer:
  dialect: org.babyfish.jimmer.sql.dialect.PostgresDialect
management.endpoints.web.exposure.include: health,info
management.endpoint.health:
  probes.enabled: true
  group:
    liveness:
      include: livenessState
      additional-path: server:/livez
    readiness:
      include: readinessState,phase7Readiness
      additional-path: server:/readyz
easy1auth.oauth2.key-encryption-secret: ${OAUTH2_KEY_ENCRYPTION_SECRET}
easy1auth.oauth2.issuer-base: ${OAUTH2_ISSUER_BASE:http://localhost:18850}
easy1auth.security.data-encryption-secret: ${SECURITY_DATA_ENCRYPTION_SECRET}
easy1auth.mail.from: ${MAIL_FROM:no-reply@easy1auth.local}
